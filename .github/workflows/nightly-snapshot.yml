name: Nightly snapshot

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC
  workflow_dispatch: {}    # manual trigger for testing

permissions:
  contents: write          # the default token may push the new snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: safe rebase before the push

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ingest fresh snapshot
        run: uv run python -m ingest.ingest

      - name: Validate with dbt
        run: uv run dbt build --profiles-dir .

      - name: Commit and push the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          git commit -m "Nightly snapshot (bot)" || echo "nothing new to commit"
          git pull --rebase origin main
          git push
